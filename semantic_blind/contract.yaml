dataset: bakery-semantic-blind
tables:
  customers:
    file: 베이커리_픽업주문.xlsx
    sheet: 회원
    key: customer_id
    columns:
      customer_id: {type: id, aliases: [회원번호], regex: '^[Kk]\s*-?\s*0*(?P<n>\d{1,3})$', format: 'K{n:03d}', required: true}
      name: {type: text, aliases: [이름]}
      phone: {type: phone, aliases: [전화]}
  orders:
    file: 베이커리_픽업주문.xlsx
    sheet: 주문
    key: order_id
    columns:
      order_id: {type: text, aliases: [주문번호], required: true}
      pickup_date: {type: date, aliases: [픽업일], required: true}
      customer_id: {type: id, aliases: [회원번호], regex: '^[Kk]\s*-?\s*0*(?P<n>\d{1,3})$', format: 'K{n:03d}'}
      customer_name: {type: text, aliases: [주문자]}
      phone: {type: phone, aliases: [전화]}
      payment: {type: category, aliases: [결제], vocab: {카드: [card], 계좌이체: [], 카카오페이: [], 토스페이: [], 현금: []}}
      status: {type: category, aliases: [상태], vocab: {접수: [], 제작중: [], 픽업대기: [], 완료: [], 취소: []}}
      note: {type: freetext, aliases: [요청]}
    extract:
      - column: note
        fields:
          candles: {type: number, description: "number of candles requested"}
          lettering: {type: text, description: "text to write on the cake"}
          pickup_phone: {type: phone, description: "phone number to contact"}
joins:
  - name: orders_members
    left: orders
    steps:
      - right: customers
        keys: [customer_id, customer_id]
        prefix: mem_
        compare: [[customer_name, name], [phone, phone]]
