# 국민건강보험공단 시군구별 국가건강검진 현황 (data.go.kr 15149732): a zip of 3 workbooks.
# nhis_1: 일반검진, one sheet per year, 2-row merged header (합계/연령대 x 대상자수/수검자수/수검률),
#   시군구 merged vertically over its 합계/남자/여자 rows; 합계 rows come BEFORE their parts.
# nhis_2: 암검진, 2-row header (위암/대장암/... x 대상자수/수검자수), 시도 merged over hundreds of rows, '-' = not eligible.
dataset: 국민건강보험공단 시군구별 국가건강검진
