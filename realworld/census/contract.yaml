# US Census Bureau CO-EST2023-POP: annual county population estimates. Title rows, a 2-row header
# (merged 'Population Estimate (as of July 1)' over the years 2020-2023), counties written '.Name County, State',
# footnote rows at the bottom.
dataset: Census county population estimates 2020-2023
tables:
  counties:
    file: co-est2023-pop.xlsx
    sheet: CO-EST2023-POP
    key: area
    columns:
      area: {type: text, aliases: [Geographic Area], required: true}
      base_2020: {type: count, aliases: ["April 1, 2020 Estimates Base"], min: 0}
      pop_2020: {type: count, aliases: [Population Estimate (as of July 1) 2020], min: 0}
      pop_2021: {type: count, aliases: [Population Estimate (as of July 1) 2021], min: 0}
      pop_2022: {type: count, aliases: [Population Estimate (as of July 1) 2022], min: 0}
      pop_2023: {type: count, aliases: [Population Estimate (as of July 1) 2023], min: 0}
