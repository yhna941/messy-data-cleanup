# Held-out contract, written from output/profile.md only (before the first cleaning run).
dataset: 봄학기 원생관리 (held-out)
tables:
  students:
    file: 2024_봄학기_원생관리(수정중).xlsx
    sheet: 원생
    key: student_id
    columns:
      student_id: {type: id, aliases: [Student ID, 학생ID], regex: '(?i)s?[-_ ]?24[-_ ]?0*(?P<n>\d{1,3})', format: 'S24-{n:03d}', required: true}
      name: {type: text, aliases: [학생명], required: true}
      grade: {type: category, aliases: [학년],
              vocab: {중3: [중학교3학년, 중3학년], 고1: [고등1, 고1학년, 고등학교1학년, h1], 고2: [고등2, 고2학년, 고등학교2학년, h2], 고3: [고등3, 고3학년, 고등학교3학년, h3]}}
      phone: {type: phone, aliases: [학부모 연락처, 연락처]}
      email: {type: email, aliases: [e-mail, 이메일]}
      reg_date: {type: date, aliases: [등록일]}
      shuttle: {type: category, aliases: [셔틀이용], vocab: {Y: [예, o, true, yes], N: [아니오, x, false, no]}}
      memo: {type: freetext, aliases: [비고]}
    dedup:
      contact_keys: [phone, email]
  courses:
    file: 2024_봄학기_원생관리(수정중).xlsx
    sheet: 강좌
    key: course_code
    columns:
      course_code: {type: id, aliases: [강좌코드], regex: '(?i)c0*(?P<n>\d{1,2})', format: 'C{n:02d}', required: true}
      course_name: {type: text, aliases: [강좌명], required: true}
      teacher: {type: text, aliases: [강사]}
      fee: {type: money, aliases: [수강료], min: 0}
  enrollments:
    file: 2024_봄학기_원생관리(수정중).xlsx
    sheet: 수강신청
    key: enroll_id
    columns:
      enroll_id: {type: id, aliases: [신청번호], regex: '(?i)e0*(?P<n>\d{1,3})', format: 'E{n:03d}', required: true}
      student_id: {type: id, aliases: [학생ID], regex: '(?i)s?[-_ ]?24[-_ ]?0*(?P<n>\d{1,3})', format: 'S24-{n:03d}', required: true}
      course: {type: category, aliases: [강좌], vocab_from: courses.course_name}
      fee: {type: money, aliases: [수강료], min: 0, max: 1000000}
      adjust: {type: money, aliases: [조정액], min: -1000000, max: 1000000}
      pay_date: {type: date, aliases: [납부일]}
      status: {type: category, aliases: [상태], vocab: {납부완료: [완납], 미납: [], 환불: []}}
    date_window: ['2024-02-01', '2024-04-30']
    dedup:
      suspect_keys: [[student_id, course]]
  attendance:
    file: 출결_export.csv
    columns:
      student_id: {type: id, aliases: [학생ID], regex: '(?i)s?[-_ ]?24[-_ ]?0*(?P<n>\d{1,3})', format: 'S24-{n:03d}', required: true}
      date: {type: date, aliases: [날짜]}
      status: {type: category, aliases: [출결], vocab: [출석, 지각, 결석, 조퇴]}
      memo: {type: freetext, aliases: [메모]}
joins:
  - name: enroll_full
    left: enrollments
    steps:
      - {right: students, keys: [student_id, student_id], prefix: stu_}
      - {right: courses, keys: [course, course_name], prefix: crs_}
  - name: attendance_students
    left: attendance
    steps:
      - {right: students, keys: [student_id, student_id], prefix: stu_}
