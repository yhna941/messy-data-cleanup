llm_layout:
- file: 쇼핑몰_주문.xlsx
  sheet: 주문
  name: order_details
  header_rows:
  - 1
  data_rows:
  - 2
  - 29
  columns:
    order_number:
      type: id
      aliases:
      - 주문번호
    order_date:
      type: date
      aliases:
      - 주문일
    customer_id:
      type: id
      aliases:
      - 고객ID
    customer_name:
      type: text
      aliases:
      - 고객명
    email:
      type: email
      aliases:
      - 이메일
    payment_method:
      type: category
      aliases:
      - 결제수단
    status:
      type: text
      aliases:
      - 상태
    discount_rate:
      type: percent
      aliases:
      - 할인율
    requests:
      type: freetext
      aliases:
      - 요청사항
- file: 쇼핑몰_주문.xlsx
  sheet: 고객
  name: 고객
  header_rows:
  - 1
  data_rows:
  - 2
  - 9
  columns:
    고객id:
      type: id
      aliases:
      - 고객ID
    이름:
      type: text
      aliases:
      - 이름
    이메일:
      type: email
      aliases:
      - 이메일
    지역:
      type: text
      aliases:
      - 지역
