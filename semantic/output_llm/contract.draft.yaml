  고객:
    file: 쇼핑몰_주문.xlsx
    sheet: 고객
    key: 고객id
    columns:
      고객id:
        type: id
        aliases:
        - 고객ID
        regex: (?i)[a-z]{0,3}[-_ ]?0*(?P<n>\d{1,8})
        format: X{n:04d}
      이름:
