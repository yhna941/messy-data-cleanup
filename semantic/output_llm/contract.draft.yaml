# DRAFT: fix types, keys, id regex/format, vocab canonicals and synonyms before use
dataset: draft
tables:
  주문:
    file: 쇼핑몰_주문.xlsx
    sheet: 주문
    key: 주문번호
    columns:
      주문번호:
        type: id
        aliases:
        - 주문번호
        regex: (?i)[a-z]{0,3}[-_ ]?0*(?P<n>\d{1,8})
        format: X{n:04d}
      주문일:
        type: date
        aliases:
        - 주문일
      고객id:
        type: id
        aliases:
        - 고객ID
        regex: (?i)[a-z]{0,3}[-_ ]?0*(?P<n>\d{1,8})
        format: X{n:04d}
      고객명:
        type: category
        aliases:
        - 고객명
        vocab:
          박지훈: []
          김민수: []
          이수진: []
          최유진: []
